<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
{{- partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">{{ i18n "skip" }}</a>
{{ partial "header.html" . }}
<main id="main">
{{- block "main" . }}{{ end -}}
</main>
{{ partial "footer.html" . }}
{{- if .Params.optin_js }}{{ with resources.Get "sms-optin.js" | resources.Minify | resources.Fingerprint "sha384" }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{- end }}{{ end }}
</body>
</html>
