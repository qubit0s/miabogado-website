apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: ghcr.io/qubit0s/miabogado-website
    digest: sha256:3277f692e2f7cb19eb258455037d39ba11e7e4aec175d7795bfd4ead01ff69e4
