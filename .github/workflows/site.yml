---
# Build, check and release the site. Every third-party action is pinned by full commit SHA.
name: site

"on":
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deploy/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || format('pr-{0}', github.ref) }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  HUGO_SHA256: 4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169
  IMAGE: ghcr.io/qubit0s/miabogado-website

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Install Hugo
        run: |
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo_${HUGO_VERSION}_linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo mv hugo /usr/local/bin/hugo

      - name: Build (any warning fails)
        run: |
          hugo --minify --gc --printI18nWarnings --printPathWarnings 2>&1 | tee "$RUNNER_TEMP/hugo.log"
          if grep -E '^(WARN|ERROR)' "$RUNNER_TEMP/hugo.log"; then echo "Hugo reported warnings"; exit 1; fi

      - name: URL parity
        run: python3 ci/check_urls.py public

      - name: Hygiene, contrast and budgets
        run: |
          python3 ci/check_output.py public
          python3 ci/check_contrast.py assets/css/site.css
          python3 ci/check_budget.py public

      - name: HTML validity (Nu HTML Checker 26.10.2)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/vnu" vnu-jar@26.10.2
          java -jar "$RUNNER_TEMP/vnu/node_modules/vnu-jar/build/dist/vnu.jar" --skip-non-html --also-check-css public

      - name: Links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --offline --root-dir "${{ github.workspace }}/public" --index-files index.html --include-fragments
            --remap "https://www.mi-abogado.us file://${{ github.workspace }}/public"
            'public/**/*.html'
          fail: true

      - name: Lighthouse
        run: npx -y @lhci/cli@0.15.1 autorun

      - name: Pre-compress and normalise permissions
        run: |
          find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.xml' -o -name '*.svg' -o -name '*.txt' -o -name '*.js' \) -exec gzip -9 -k -n {} \;
          chmod -R u=rwX,go=rX public

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: public
          path: public
          retention-days: 7

      - name: Set up Buildx
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the pushed image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          only-fixed: true
          severity-cutoff: high
          fail-build: true
      - name: Show scan findings
        if: failure() && steps.build.outcome == 'success'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          "$(ls /opt/hostedtoolcache/grype/*/x64/grype | head -1)" "${IMAGE}@${DIGEST}" -o table --only-fixed

      - name: Commit the new digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "deploy/kustomization.yaml"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"digest: sha256:[0-9a-f]{64}", "digest: " + os.environ["DIGEST"], s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          git commit -m "Release ${SOURCE_SHA::7}: image digest ${DIGEST}" || exit 0
          git pull --rebase
          git push
