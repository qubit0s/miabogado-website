ntaTitle: ¿Dónde está tu caso hoy?
ntaSub: 'No importa dónde esté tu caso hoy: lo tomamos desde ahí — hasta tu audiencia final.'
ntaLink: Así funciona el proceso completo
steps:
- k: TU MASTER HEARING SE ACERCA
  t: Tu primera cita en corte está cerca
  d: Nos presentamos ante el juez contigo y protegemos tu caso desde el primer día.
- k: TU ASILO YA ESTÁ PRESENTADO
  t: Un paralegal presentó tu solicitud
  d: La revisamos, corregimos lo que haga falta y tomamos tu representación completa.
- k: TU AUDIENCIA FINAL YA TIENE FECHA
  t: La audiencia individual está a meses
  d: Esta es la audiencia que decide tu caso. Construimos tu estrategia, tu testimonio y tu evidencia
    desde ahora.
repTitle: Representación completa. No trámites sueltos.
repBody: Desde que nos contratas somos tus abogados — en cada audiencia, en cada documento, hasta tu audiencia
  final. Un paralegal solo puede llenar formularios, y otros despachos no empiezan hasta recibir el pago
  completo. Nosotros empezamos el día que firmas.
enaQuote: “Mi familia también llegó a este país empezando de cero.”
enaBody: Ena llegó a Estados Unidos como refugiada. Hoy dirige cada caso de deportación de Mi Abogado
  y te representa ante el juez. Su equipo te atiende en tu idioma; ella pelea tu caso.
enaLink: Conoce a tu abogada
revTitle: En palabras de un cliente
revQuote: “Mi experiencia fue excelente, realmente estoy muy feliz con la asesoría y todo el proceso,
  siempre estuvieron pendientes de mi caso, muy profesional todo el equipo de trabajo. Lo recomiendo a
  todas aquellas personas que estén buscando un abogado.”
revBy: Cliente de Mi Abogado · reseña verificada
revNote: 'Compartimos las palabras de nuestros clientes solo con su permiso. Nunca publicamos fotos, nombres
  completos ni detalles de ningún caso: tu privacidad es parte de tu defensa.'
trust:
- k: LA FAMILIA MI
  q: 'Mi Abogado se sostiene sobre la misma reputación que Mi Reembolso y Mi Asistente: cientos de familias
    ya confían en el nombre Mi por su servicio honesto y sus respuestas claras.'
- k: NUNCA TE QUEDAS SIN SABER
  q: 'Cada mes sabes en qué va tu caso: qué se presentó, qué falta y cuál es la siguiente fecha. Sin adivinar,
    sin llamadas sin respuesta.'
defTitle: Qué pasa después de recibir una carta de la corte — y cómo te defendemos.
defSub: Faltar a tu audiencia casi siempre termina en deportación. Ir preparado cambia la historia. Cuéntanos
  dónde está tu caso y te decimos exactamente qué sigue.
defTimelineTitle: El camino típico de un caso
timeline:
- n: '1'
  t: Recibes la NTA
  d: 'La carta indica de qué te acusa el gobierno y cuándo debes presentarte. No la ignores: faltar a
    la audiencia casi siempre termina en orden de deportación.'
- n: '2'
  t: Primera audiencia (Master Calendar)
  d: Una cita corta ante el juez para fijar el rumbo del caso. Nos presentamos como tus abogados y pedimos
    el tiempo que tu defensa necesita.
- n: '3'
  t: Presentamos tu solicitud de asilo
  d: Preparamos tu historia y tu evidencia y la presentamos ante la corte — o revisamos y corregimos una
    solicitud que otra persona ya presentó. Este paso inicia el reloj de tu permiso de trabajo.
- n: '4'
  t: Obtienes tu permiso de trabajo
  d: La mayoría de nuestros clientes pueden trabajar legalmente de 6 a 12 meses después de presentada
    su solicitud.
- n: '5'
  t: Audiencia final (merits)
  d: El juez escucha tu caso completo. Para entonces ya construimos tu estrategia legal, escribimos los
    argumentos y preparamos tu evidencia, tu testimonio y tus testigos con anticipación.
takeTitle: ¿Lo has llevado solo? Haz que lo revisen antes de que un juez decida.
takeBody: Si has manejado tu caso por tu cuenta, o un "paralegal" presentó partes de él, puede haber errores
  esperando en tu expediente — y un juez puede rechazar una solicitud defectuosa y acelerar la deportación.
  Haz que lo revisen ahora, mientras todavía se puede corregir. Revisamos todo lo presentado, corregimos
  lo necesario y tomamos la representación completa desde ahí.
fortTitle: ¿Tu audiencia es en Fort Snelling?
fortBody: 'La corte de Fort Snelling comenzó audiencias aceleradas y muchas fechas se están adelantando.
  Revisa tu fecha en el sistema de la corte (EOIR) y llámanos con ella: te explicamos qué significa para
  tu caso y qué esperar ese día.'
faqTitle: Preguntas frecuentes
faq:
- q: ¿Puedo cambiar mi audiencia si me mudé de estado?
  a: Sí. Se puede pedir un cambio de sede (change of venue) o atender por video. Lo gestionamos por ti.
- q: ¿Qué pasa si ya perdí una audiencia?
  a: 'Actúa rápido: en algunos casos se puede reabrir el caso (motion to reopen). Llámanos hoy mismo.'
- q: ¿Necesito hablar inglés para mi caso?
  a: No. La corte provee intérprete y nuestro equipo te atiende en español en todo momento.
- q: ¿Cuánto tarda todo el proceso?
  a: Normalmente de 1 a 3 años, aunque con las audiencias aceleradas algunos casos avanzan más rápido.
    Te mantenemos informado en cada etapa.
- q: Un paralegal ya preparó mi solicitud. ¿Me pueden ayudar?
  a: Sí — es de los casos que más recibimos. Revisamos lo presentado, corregimos errores que pueden costar
    el caso en la audiencia final y tomamos la representación completa. Un paralegal no puede defenderte
    ante el juez; nosotros sí.
- q: Ya tengo mi permiso de trabajo. ¿Todavía me sirven?
  a: 'Sí. El permiso de trabajo no resuelve tu caso: la audiencia final decide si te quedas. Esa es exactamente
    la parte donde más necesitas una defensa preparada.'
priceTitle: Tu defensa no puede esperar a que juntes todo el dinero.
priceSub: 'Por eso empezamos ya: $9,500 fijos, pagos semanales según tu fecha de audiencia, y tu abogada
  trabajando desde la primera firma — no desde el último pago.'
feeLabel: PRECIO FIJO · TODO INCLUIDO
feeSub: todo tu caso, de principio a fin
priceWeekly: 'Pagos semanales a tu medida: el plan se calcula según la fecha de tu audiencia final y queda
  por escrito en tu contrato.'
inclTitle: Qué incluye
includes:
- Todas tus audiencias ante el juez — desde la primera (MCH) hasta la audiencia final de méritos
- 'Tu solicitud de asilo: la preparamos, o revisamos y corregimos la que ya presentaste'
- Tu permiso de trabajo — solicitud o renovación durante el caso
- 'Preparación completa del merits: tu testimonio, tus testigos y tu evidencia'
- Comunicación en español, por teléfono y mensaje de texto, durante todo el caso
priceNotes:
- t: En tu caso desde el día uno
  d: Una vez contratados, somos tus abogados. No esperamos el pago completo para empezar a trabajar.
- t: Todo por escrito
  d: Tu precio, tu plan de pagos y cada término — detallados en tu contrato antes de firmar.
- t: A diferencia de un paralegal
  d: Un paralegal llena formularios. Nosotros te representamos ante el juez — la parte que decide tu caso.
priceDisclaimer: El plan de pagos exacto se define en tu consulta inicial según la fecha de tu audiencia,
  y todo queda por escrito en tu contrato. Nunca pagarás algo que no esté ahí.
svcTitle: ¿No tienes caso en corte todavía? Mejor prevenir ahora.
svcSub: 'Asilo, permisos, peticiones: hazlo bien desde el principio y evita terminar frente a un juez.
  Y si ya estás en corte, esa es nuestra especialidad.'
services:
- t: Asilo afirmativo
  d: Si aún no tienes caso en corte, presentamos tu solicitud ante USCIS.
- t: Permiso de trabajo
  d: Solicitud y renovación de tu autorización de empleo (EAD).
- t: Visa U
  d: Protección para víctimas de ciertos crímenes que cooperan con las autoridades.
- t: Visa T
  d: Protección para víctimas de trata de personas.
- t: Peticiones familiares
  d: Reunifica a tu familia mediante peticiones de familiares directos.
- t: Residencia (Green Card)
  d: Ajuste de estatus para quienes califican.
- t: Ciudadanía
  d: Naturalización y preparación para tu examen.
- t: VAWA
  d: Petición propia para víctimas de abuso por parte de un familiar ciudadano o residente.
svcNote: ¿Tienes un caso en la corte de inmigración? Esa es nuestra especialidad.
ctaTitle: Tu audiencia no va a esperar. Tu defensa tampoco debería.
ctaSub: Llámanos o escríbenos — te respondemos el mismo día, en tu idioma.
