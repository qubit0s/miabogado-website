ena:
  kicker: CARTA DE LA ABOGADA PRINCIPAL
  h1: Por qué dedico mi práctica a la corte de inmigración.
  paras:
  - Mi familia llegó a Estados Unidos como refugiados cuando yo era niña. Crecí viendo a mis padres reconstruir
    su vida en un idioma nuevo, con reglas nuevas, esperando decisiones importantes en manos de personas
    que no conocíamos.
  - 'Escogí la corte de inmigración porque es donde una buena preparación se nota más: un expediente completo,
    una solicitud bien fundamentada y un argumento legal sólido cambian el resultado de una audiencia.'
  - 'Así trabajamos en Mi Abogado: te explicamos tu caso con claridad desde la primera llamada, y cuando
    nos contratas empezamos a trabajarlo ese mismo día — no cuando termines de pagar.'
  sign: Ena · Abogada principal, Mi Abogado
  deskTitle: EL DESPACHO
  desk:
  - Abogada licenciada — casos de inmigración en todo el país
  - Práctica dedicada a la defensa ante la corte de inmigración (EOIR)
  - Atención en español e inglés
