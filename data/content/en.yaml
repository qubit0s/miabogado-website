defTitle: What happens after you get a letter from the court — and how we defend you.
defSub: Missing your hearing almost always ends in deportation. Arriving prepared changes the story. Tell
  us where your case stands and we'll tell you exactly what comes next.
defTimelineTitle: The typical path of a case
timeline:
- n: '1'
  t: You receive the NTA
  d: 'The letter states the government''s charges and when you must appear. Don''t ignore it: missing
    your hearing almost always ends in a deportation order.'
- n: '2'
  t: First hearing (Master Calendar)
  d: A short appearance before the judge to set the course of the case. We appear as your attorneys and
    ask for the time your defense needs.
- n: '3'
  t: We file your asylum application
  d: We prepare your story and evidence and file with the court — or revise and correct an application
    someone else already filed. This step starts the clock on your work permit.
- n: '4'
  t: You get your work permit
  d: Most of our clients can work legally 6–12 months after their application is filed.
- n: '5'
  t: Final (merits) hearing
  d: The judge hears your full case. By then we have built your legal strategy, written the arguments,
    and prepared your evidence, testimony, and witnesses well in advance.
takeTitle: Handling it alone? Get it reviewed before a judge rules on it.
takeBody: If you've been navigating your case yourself, or a "paralegal" filed parts of it, errors may
  already be sitting in your file — and judges can pretermit a defective application and fast-track deportation.
  Have it reviewed now, while it can still be corrected. We review everything filed, fix what needs fixing,
  and take complete representation from there.
fortTitle: Is your hearing at Fort Snelling?
fortBody: 'The Fort Snelling court has begun accelerated hearings and many dates are moving up. Look up
  your date in the court''s system (EOIR) and call us with it: we''ll explain what it means for your case
  and what to expect that day.'
faqTitle: Frequently asked questions
faq:
- q: Can I move my hearing if I relocated to another state?
  a: Yes. You can request a change of venue or appear by video. We handle it for you.
- q: What if I already missed a hearing?
  a: 'Act fast: in some cases the case can be reopened (motion to reopen). Call us today.'
- q: Do I need to speak English for my case?
  a: No. The court provides an interpreter and our team serves you in Spanish at every step.
- q: How long does the whole process take?
  a: Usually 1–3 years, though with accelerated hearings some cases move faster. We keep you informed
    at every stage.
- q: A paralegal already prepared my application. Can you help?
  a: Yes — it's one of the cases we see most. We review what was filed, fix errors that can cost you the
    case at the final hearing, and take complete representation. A paralegal can't defend you before the
    judge; we can.
- q: I already have my work permit. Do I still need you?
  a: 'Yes. A work permit doesn''t resolve your case: the final hearing decides whether you stay. That
    is exactly the part where you most need a prepared defense.'
