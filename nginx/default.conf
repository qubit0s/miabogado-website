map $host $robots_tag {
    default "noindex, nofollow";
    www.mi-abogado.us "";
    mi-abogado.us "";
}

server {
    listen 8080;
    server_name mi-abogado.us;
    access_log off;
    return 301 https://www.mi-abogado.us$request_uri;
}

server {
    listen 8080 default_server;
    server_name www.mi-abogado.us _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    access_log off;
    etag on;
    gzip off;
    gzip_static on;
    gzip_vary on;
    add_header_inherit merge;

    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://mi-abogado-auto.poly.one https://auto.mi-abogado.us; object-src 'none'; upgrade-insecure-requests" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|woff2|avif|webp|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|svg|ico|txt|xml)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location /en/ {
        error_page 404 /en/404.html;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    location = /404.html { internal; }
    location = /en/404.html { internal; }
}
